<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>helmmeis.de</title>
    <style>
        .sphaere-launch {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            box-sizing: border-box;
            max-width: calc(100% - 12px);
            min-height: 84px;
            margin: 24px 8px 32px 0;
            padding: 18px 26px;
            border: 3px solid #202334;
            border-radius: 24px;
            background: #fff06a;
            box-shadow: 6px 6px 0 #202334;
            color: #202334;
            font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
            text-decoration: none;
            touch-action: manipulation;
            transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
        }

        .sphaere-launch__rocket {
            flex-shrink: 0;
            font-size: 2.5rem;
            line-height: 1;
            animation: sphaere-ready 2.4s ease-in-out infinite;
        }

        .sphaere-launch__text {
            min-width: 0;
            text-align: left;
        }

        .sphaere-launch__text strong {
            display: block;
            font-size: clamp(1.1rem, 3.5vw, 1.4rem);
            font-weight: 800;
            line-height: 1.3;
        }

        .sphaere-launch__text small {
            display: block;
            margin-top: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            line-height: 1.4;
        }

        @media (hover: hover) {
            .sphaere-launch:hover {
                transform: translate(-2px, -2px) rotate(-1deg);
                box-shadow: 8px 8px 0 #202334;
                background: #ffdf49;
            }
        }

        .sphaere-launch:focus-visible {
            outline: 3px solid #2855e8;
            outline-offset: 6px;
        }

        .sphaere-launch:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 #202334;
        }

        @keyframes sphaere-ready {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: translateY(-4px) rotate(8deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .sphaere-launch { transition: none; }
            .sphaere-launch__rocket { animation: none; }
        }
    </style>
</head>

<body>
    <h1>Hallo Welt!</h1>
    <p>Meine erste eigene Website läuft auf GitHub Pages.</p>
    <a class="sphaere-launch" href="./sphaere.html">
        <span class="sphaere-launch__rocket" aria-hidden="true">🚀</span>
        <span class="sphaere-launch__text">
            <strong>Ab durch die Kugel!</strong>
            <small>Spiel starten</small>
        </span>
    </a>
</body>

</html>
