<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Team Maxi & Leo vs. Emma</title>
    <!-- Tailwind CSS für modernes UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js für flüssige 3D-Grafik -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Kinderfreundliche Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            touch-action: none;
            overflow: hidden;
            background: #87CEEB;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .btn-touch {
            transition: transform 0.1s, background-color 0.1s;
        }
        .btn-touch:active {
            transform: scale(0.85);
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden">

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- UI Overlay für iPad & Touchscreen -->
    <div class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-3 md:p-5">
        
        <!-- Punktetabelle & Titel -->
        <div class="flex justify-between items-center bg-white/90 backdrop-blur-md px-4 md:px-6 py-2 md:py-3 rounded-3xl shadow-xl pointer-events-auto border-4 border-amber-300">
            <!-- Team Maxi & Leo -->
            <div class="flex items-center space-x-2 md:space-x-3">
                <div class="flex -space-x-1">
                    <div class="w-5 h-5 rounded-full bg-blue-500 border-2 border-white"></div>
                    <div class="w-5 h-5 rounded-full bg-green-500 border-2 border-white"></div>
                </div>
                <div class="text-left">
                    <div class="text-xs font-bold text-gray-500 uppercase tracking-wider">Team Jungs</div>
                    <div class="text-base md:text-2xl font-black text-blue-600">
                        Maxi & Leo: <span id="score-team">0</span> 🌟
                    </div>
                </div>
            </div>
            
            <!-- Mitte -->
            <div class="text-center px-2">
                <h1 class="text-sm md:text-xl font-black text-amber-500 drop-shadow">Großes Geschwister-Duell 🏆</h1>
                <p class="text-xs font-bold text-gray-600">Sterne: <span id="score-total">0</span> / 15</p>
            </div>

            <!-- Team Emma -->
            <div class="flex items-center space-x-2 md:space-x-3">
                <div class="text-right">
                    <div class="text-xs font-bold text-gray-500 uppercase tracking-wider">Große Schwester</div>
                    <div class="text-base md:text-2xl font-black text-pink-600">
                        <span id="score-emma">0</span> 🌟 :Emma
                    </div>
                </div>
                <div class="w-6 h-6 rounded-full bg-pink-500 border-2 border-white animate-pulse"></div>
            </div>
        </div>

        <!-- Gewinn-Modal -->
        <div id="win-modal" class="absolute inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center pointer-events-auto z-50">
            <div class="bg-yellow-50 border-8 border-yellow-400 rounded-3xl p-6 md:p-8 max-w-md w-11/12 text-center shadow-2xl">
                <h2 id="win-title" class="text-3xl md:text-4xl font-black text-amber-600 mb-2">🎉 Hurra! 🎉</h2>
                
                <!-- Ergebnisanzeige -->
                <div class="bg-white rounded-2xl p-4 my-4 border-2 border-yellow-300 shadow-inner">
                    <p class="text-sm font-bold text-gray-500 uppercase mb-2">Endergebnis</p>
                    <div class="flex justify-around items-center text-lg md:text-xl font-extrabold mb-3">
                        <div class="text-blue-600">💙💚 Maxi & Leo:<br><span id="win-score-team" class="text-2xl">0</span> 🌟</div>
                        <div class="text-gray-300 text-2xl">|</div>
                        <div class="text-pink-600">💖 Emma:<br><span id="win-score-emma" class="text-2xl">0</span> 🌟</div>
                    </div>
                    <p class="text-xs text-gray-500 mb-2">(Maxi: <span id="win-detail-maxi">0</span> ⭐ | Leo: <span id="win-detail-leo">0</span> ⭐)</p>
                    <p id="win-message" class="text-base md:text-lg font-bold text-amber-700 mt-2"></p>
                </div>

                <button onclick="restartGame()" class="bg-gradient-to-r from-amber-400 to-orange-500 text-white font-bold text-xl px-8 py-4 rounded-2xl shadow-lg hover:scale-105 active:scale-95 transition-transform border-b-4 border-orange-700">
                    Revanche starten! 🚀
                </button>
            </div>
        </div>

        <!-- Touch-Steuerung für alle 3 Kinder (Maxi links, Leo mitte, Emma rechts) -->
        <div class="flex justify-between items-end w-full pb-1 pointer-events-auto gap-2">
            
            <!-- Maxi Steuerkreuz (Blau) -->
            <div class="bg-blue-500/20 backdrop-blur-md p-2 md:p-3 rounded-3xl border-2 border-blue-400 shadow-xl flex flex-col items-center">
                <div class="text-blue-800 font-bold text-xs md:text-sm mb-1">💙 Maxi</div>
                <div class="grid grid-cols-3 gap-1.5 w-28 h-28 md:w-36 md:h-36">
                    <div></div>
                    <button id="btn-maxi-up" class="btn-touch bg-blue-500 active:bg-blue-700 text-white text-xl md:text-2xl font-bold rounded-xl md:rounded-2xl shadow-md flex items-center justify-center">⬆️</button>
                    <div></div>
                    <button id="btn-maxi-left" class="btn-touch bg-blue-500 active:bg-blue-700 text-white text-xl md:text-2xl font-bold rounded-xl md:rounded-2xl shadow-md flex items-center justify-center">⬅️</button>
                    <button id="btn-maxi-down" class="btn-touch bg-blue-500 active:bg-blue-700 text-white text-xl md:text-2xl font-bold rounded-xl md:rounded-2xl shadow-md flex items-center justify-center">⬇️</button>
                    <button id="btn-maxi-right" class="btn-touch bg-blue-500 active:bg-blue-700 text-white text-xl md:text-2xl font-bold rounded-xl md:rounded-2xl shadow-md flex items-center justify-center">➡️</button>
                </div>
            </div>

            <!-- Leo Steuerkreuz (Grün - in der Mitte für gemeinsames Spielen) -->
            <div class="bg-green-500/20 backdrop-blur-md p-2 md:p-3 rounded-3xl border-2 border-green-400 shadow-xl flex flex-col items-center">
                <div class="text-green-800 font-bold text-xs md:text-sm mb-1">💚 Leo</div>
                <div class="grid grid-cols-3 gap-1.5 w-28 h-28 md:w-36 md:h-36">
                    <div></div>
                    <button id="btn-leo-up" class="btn-touch bg-green-500 active:bg-green-700 text-white text-xl md:text-2xl font-bold rounded-xl md:rounded-2xl shadow-md flex items-center justify-center">⬆️</button>
                    <div></div>
                    <button id="btn-leo-left" class="btn-touch bg-green-500 active:bg-green-700 text-white text-xl md:text-2xl font-bold rounded-xl md:rounded-2xl shadow-md flex items-center justify-center">⬅️</button>
                    <button id="btn-leo-down" class="btn-touch bg-green-500 active:bg-green-700 text-white text-xl md:text-2xl font-bold rounded-xl md:rounded-2xl shadow-md flex items-center justify-center">⬇️</button>
                    <button id="btn-leo-right" class="btn-touch bg-green-500 active:bg-green-700 text-white text-xl md:text-2xl font-bold rounded-xl md:rounded-2xl shadow-md flex items-center justify-center">➡️</button>
                </div>
            </div>

            <!-- Emma Steuerkreuz (Pink - rechts für die große Schwester) -->
            <div class="bg-pink-500/20 backdrop-blur-md p-2 md:p-3 rounded-3xl border-2 border-pink-400 shadow-xl flex flex-col items-center">
                <div class="text-pink-800 font-bold text-xs md:text-sm mb-1">💖 Emma</div>
                <div class="grid grid-cols-3 gap-1.5 w-28 h-28 md:w-36 md:h-36">
                    <div></div>
                    <button id="btn-emma-up" class="btn-touch bg-pink-500 active:bg-pink-700 text-white text-xl md:text-2xl font-bold rounded-xl md:rounded-2xl shadow-md flex items-center justify-center">⬆️</button>
                    <div></div>
                    <button id="btn-emma-left" class="btn-touch bg-pink-500 active:bg-pink-700 text-white text-xl md:text-2xl font-bold rounded-xl md:rounded-2xl shadow-md flex items-center justify-center">⬅️</button>
                    <button id="btn-emma-down" class="btn-touch bg-pink-500 active:bg-pink-700 text-white text-xl md:text-2xl font-bold rounded-xl md:rounded-2xl shadow-md flex items-center justify-center">⬇️</button>
                    <button id="btn-emma-right" class="btn-touch bg-pink-500 active:bg-pink-700 text-white text-xl md:text-2xl font-bold rounded-xl md:rounded-2xl shadow-md flex items-center justify-center">➡️</button>
                </div>
            </div>

        </div>

    </div>

    <!-- 3D Spiel- und Audiologik -->
    <script>
        // Web Audio API für fröhliche Soundeffekte
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playChime(isEmma) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = isEmma ? 'sine' : 'triangle';
            const baseFreq = isEmma ? 523.25 : 440;
            osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 2, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playWinSound() {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }, idx * 120);
            });
        }

        // Three.js Variablen
        let scene, camera, renderer;
        let maxi, leo, emma;
        let stars = [];
        let particles = [];
        
        let scoreMaxi = 0;
        let scoreLeo = 0;
        let scoreEmma = 0;
        const totalStarsCount = 15;

        const keysMaxi = { up: false, down: false, left: false, right: false };
        const keysLeo = { up: false, down: false, left: false, right: false };
        const keysEmma = { up: false, down: false, left: false, right: false };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7dd3fc);
            scene.fog = new THREE.FogExp2(0x7dd3fc, 0.013);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 25, 25);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Beleuchtung
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 0.85);
            sunLight.position.set(22, 42, 22);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            const d = 28;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            createWorld();

            // Spielfiguren erstellen
            // Maxi (Blau), Leo (Grün), Emma (Pink - etwas größer und flinker!)
            maxi = createCharacter(0x3b82f6, 0x1d4ed8, "Maxi", new THREE.Vector3(-6, 0.5, 2), 1.0, 0.13, false);
            leo = createCharacter(0x22c55e, 0x15803d, "Leo", new THREE.Vector3(-2, 0.5, 4), 1.0, 0.13, false);
            emma = createCharacter(0xec4899, 0xbe185d, "Emma", new THREE.Vector3(6, 0.5, -2), 1.15, 0.155, true);

            spawnStars();

            window.addEventListener('resize', onWindowResize);
            setupTouchControls();

            animate();
        }

        function createWorld() {
            // Große Wiesen-Arena
            const groundGeo = new THREE.CylinderGeometry(24, 26, 2, 36);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.position.y = -1;
            ground.receiveShadow = true;
            scene.add(ground);

            const dirtGeo = new THREE.CylinderGeometry(26, 27, 3, 36);
            const dirtMat = new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 0.9 });
            const dirt = new THREE.Mesh(dirtGeo, dirtMat);
            dirt.position.y = -3;
            dirt.receiveShadow = true;
            scene.add(dirt);

            // Dekorative Bäume am Rand
            const treePositions = [
                { x: -14, z: -14 }, { x: 15, z: 12 }, { x: -15, z: 14 }, { x: 14, z: -15 },
                { x: -20, z: 0 }, { x: 20, z: 2 }, { x: 0, z: -20 }, { x: 0, z: 20 },
                { x: -10, z: -17 }, { x: 11, z: 17 }
            ];
            treePositions.forEach(pos => createTree(pos.x, pos.z));

            // Bunte Blumen auf der Wiese
            const flowerColors = [0xfef08a, 0xf472b6, 0x60a5fa, 0xffffff];
            for (let i = 0; i < 25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 19;
                createFlower(Math.cos(angle) * radius, Math.sin(angle) * radius, flowerColors[i % flowerColors.length]);
            }

            // Wolken
            for (let i = 0; i < 7; i++) {
                createCloud((Math.random() - 0.5) * 45, 16 + Math.random() * 5, (Math.random() - 0.5) * 45);
            }
        }

        function createFlower(x, z, colorHex) {
            const flower = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.3, 0.1, 6),
                new THREE.MeshBasicMaterial({ color: colorHex })
            );
            flower.position.set(x, 0.05, z);
            scene.add(flower);
        }

        function createTree(x, z) {
            const treeGroup = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.6, 0.9, 3, 8),
                new THREE.MeshStandardMaterial({ color: 0x854d0e })
            );
            trunk.position.y = 1.5;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.6 });
            const l1 = new THREE.Mesh(new THREE.SphereGeometry(2.1, 8, 8), leavesMat);
            l1.position.y = 3.6;
            l1.castShadow = true;
            treeGroup.add(l1);

            const l2 = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.6 }));
            l2.position.set(1, 4.6, 0);
            l2.castShadow = true;
            treeGroup.add(l2);

            treeGroup.position.set(x, 0, z);
            scene.add(treeGroup);
        }

        function createCloud(x, y, z) {
            const cloudGroup = new THREE.Group();
            const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, transparent: true, opacity: 0.9 });
            for (let i = 0; i < 4; i++) {
                const puff = new THREE.Mesh(new THREE.SphereGeometry(1.5 + Math.random() * 0.8, 8, 8), cloudMat);
                puff.position.set(i * 1.2 - 1.8, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.8);
                cloudGroup.add(puff);
            }
            cloudGroup.position.set(x, y, z);
            scene.add(cloudGroup);
        }

        function createCharacter(bodyColor, accentColor, name, initialPos, scaleFactor, speed, isCrown) {
            const group = new THREE.Group();

            const body = new THREE.Mesh(
                new THREE.SphereGeometry(1 * scaleFactor, 16, 16),
                new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.3, metalness: 0.2 })
            );
            body.position.y = 1 * scaleFactor;
            body.castShadow = true;
            group.add(body);

            // Augen
            const eyeGeo = new THREE.SphereGeometry(0.2 * scaleFactor, 8, 8);
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const pupilMat = new THREE.MeshStandardMaterial({ color: 0x000000 });

            const eyeLeft = new THREE.Mesh(eyeGeo, eyeMat);
            eyeLeft.position.set(-0.35 * scaleFactor, 1.3 * scaleFactor, 0.85 * scaleFactor);
            group.add(eyeLeft);
            const pLeft = new THREE.Mesh(new THREE.SphereGeometry(0.1 * scaleFactor, 8, 8), pupilMat);
            pLeft.position.set(-0.35 * scaleFactor, 1.3 * scaleFactor, 0.98 * scaleFactor);
            group.add(pLeft);

            const eyeRight = new THREE.Mesh(eyeGeo, eyeMat);
            eyeRight.position.set(0.35 * scaleFactor, 1.3 * scaleFactor, 0.85 * scaleFactor);
            group.add(eyeRight);
            const pRight = new THREE.Mesh(new THREE.SphereGeometry(0.1 * scaleFactor, 8, 8), pupilMat);
            pRight.position.set(0.35 * scaleFactor, 1.3 * scaleFactor, 0.98 * scaleFactor);
            group.add(pRight);

            // Kopfbedeckung: Krone für Emma (8 Jahre), Kappe für Maxi & Leo (5 Jahre)
            if (isCrown) {
                const crownMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.6, roughness: 0.2 });
                const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.5, 0.45, 8), crownMat);
                crown.position.set(0, 2.05 * scaleFactor, 0);
                crown.castShadow = true;
                group.add(crown);
            } else {
                const hatMat = new THREE.MeshStandardMaterial({ color: accentColor });
                const hatBase = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.2, 12), hatMat);
                hatBase.position.set(0, 1.9, 0);
                hatBase.castShadow = true;
                group.add(hatBase);

                const hatTop = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 12), hatMat);
                hatTop.position.set(0, 2.1, 0);
                hatTop.scale.set(1, 0.7, 1);
                group.add(hatTop);
            }

            // 3D Name direkt über der Figur
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = name === "Maxi" ? '#1d4ed8' : (name === "Leo" ? '#15803d' : '#be185d');
            ctx.font = 'bold 52px Fredoka, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(name, 128, 75);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.set(0, 3.3 * scaleFactor, 0);
            sprite.scale.set(2.2, 1.1, 1);
            group.add(sprite);

            group.position.copy(initialPos);
            scene.add(group);

            return {
                mesh: group,
                position: group.position,
                speed: speed,
                scale: scaleFactor
            };
        }

        function spawnStars() {
            const starGeo = new THREE.OctahedronGeometry(0.85, 0);
            const starMat = new THREE.MeshStandardMaterial({ 
                color: 0xfde047, 
                emissive: 0xfacc15, 
                emissiveIntensity: 0.85,
                roughness: 0.2,
                metalness: 0.8
            });

            // 15 Sterne fair auf der ganzen Insel verteilt
            const positions = [
                { x: 0, z: 0 },
                { x: -10, z: 10 }, { x: 10, z: -10 }, { x: -12, z: -8 }, { x: 12, z: 8 },
                { x: -5, z: -13 }, { x: 5, z: 13 }, { x: -16, z: 4 }, { x: 16, z: -4 },
                { x: -3, z: 15 }, { x: 3, z: -15 }, { x: -11, z: 0 }, { x: 11, z: 0 },
                { x: -6, z: -6 }, { x: 6, z: 6 }
            ];

            positions.forEach((pos, idx) => {
                const star = new THREE.Mesh(starGeo, starMat);
                star.position.set(pos.x, 1, pos.z);
                star.rotation.x = Math.random() * Math.PI;
                star.rotation.y = Math.random() * Math.PI;
                star.userData = { id: idx, collected: false, initialY: 1 };
                scene.add(star);
                stars.push(star);
            });
        }

        function createConfetti(x, y, z) {
            const colors = [0xf472b6, 0xfacc15, 0x4ade80, 0x60a5fa, 0xc084fc, 0xffffff];
            for (let i = 0; i < 25; i++) {
                const pGeo = new THREE.BoxGeometry(0.25, 0.25, 0.05);
                const pMat = new THREE.MeshBasicMaterial({ color: colors[Math.floor(Math.random() * colors.length)] });
                const particle = new THREE.Mesh(pGeo, pMat);
                particle.position.set(x, y, z);
                
                particle.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.35,
                        Math.random() * 0.35 + 0.1,
                        (Math.random() - 0.5) * 0.35
                    ),
                    rotationSpeed: new THREE.Vector3(Math.random()*0.2, Math.random()*0.2, Math.random()*0.2),
                    life: 1.0
                };
                scene.add(particle);
                particles.push(particle);
            }
        }

        function setupTouchControls() {
            const bindButton = (id, keyState, prop) => {
                const el = document.getElementById(id);
                if (!el) return;
                
                const press = (e) => { e.preventDefault(); keyState[prop] = true; };
                const release = (e) => { e.preventDefault(); keyState[prop] = false; };

                el.addEventListener('mousedown', press);
                el.addEventListener('mouseup', release);
                el.addEventListener('mouseleave', release);
                el.addEventListener('touchstart', press, { passive: false });
                el.addEventListener('touchend', release, { passive: false });
            };

            // Maxi
            bindButton('btn-maxi-up', keysMaxi, 'up');
            bindButton('btn-maxi-down', keysMaxi, 'down');
            bindButton('btn-maxi-left', keysMaxi, 'left');
            bindButton('btn-maxi-right', keysMaxi, 'right');

            // Leo
            bindButton('btn-leo-up', keysLeo, 'up');
            bindButton('btn-leo-down', keysLeo, 'down');
            bindButton('btn-leo-left', keysLeo, 'left');
            bindButton('btn-leo-right', keysLeo, 'right');

            // Emma
            bindButton('btn-emma-up', keysEmma, 'up');
            bindButton('btn-emma-down', keysEmma, 'down');
            bindButton('btn-emma-left', keysEmma, 'left');
            bindButton('btn-emma-right', keysEmma, 'right');

            // Tastatur-Fallback (für Tests am PC)
            window.addEventListener('keydown', (e) => {
                if (e.key === 'w' || e.key === 'W') keysMaxi.up = true;
                if (e.key === 's' || e.key === 'S') keysMaxi.down = true;
                if (e.key === 'a' || e.key === 'A') keysMaxi.left = true;
                if (e.key === 'd' || e.key === 'D') keysMaxi.right = true;

                if (e.key === 't' || e.key === 'T') keysLeo.up = true;
                if (e.key === 'g' || e.key === 'G') keysLeo.down = true;
                if (e.key === 'f' || e.key === 'F') keysLeo.left = true;
                if (e.key === 'h' || e.key === 'H') keysLeo.right = true;

                if (e.key === 'ArrowUp') keysEmma.up = true;
                if (e.key === 'ArrowDown') keysEmma.down = true;
                if (e.key === 'ArrowLeft') keysEmma.left = true;
                if (e.key === 'ArrowRight') keysEmma.right = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'w' || e.key === 'W') keysMaxi.up = false;
                if (e.key === 's' || e.key === 'S') keysMaxi.down = false;
                if (e.key === 'a' || e.key === 'A') keysMaxi.left = false;
                if (e.key === 'd' || e.key === 'D') keysMaxi.right = false;

                if (e.key === 't' || e.key === 'T') keysLeo.up = false;
                if (e.key === 'g' || e.key === 'G') keysLeo.down = false;
                if (e.key === 'f' || e.key === 'F') keysLeo.left = false;
                if (e.key === 'h' || e.key === 'H') keysLeo.right = false;

                if (e.key === 'ArrowUp') keysEmma.up = false;
                if (e.key === 'ArrowDown') keysEmma.down = false;
                if (e.key === 'ArrowLeft') keysEmma.left = false;
                if (e.key === 'ArrowRight') keysEmma.right = false;
            });
        }

        function updateCharacter(char, keys) {
            let moveX = 0;
            let moveZ = 0;

            if (keys.up) moveZ -= 1;
            if (keys.down) moveZ += 1;
            if (keys.left) moveX -= 1;
            if (keys.right) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                const dir = new THREE.Vector3(moveX, 0, moveZ).normalize();
                char.position.x += dir.x * char.speed;
                char.position.z += dir.z * char.speed;

                // Inselbegrenzung (Radius ~20)
                const distFromCenter = Math.sqrt(char.position.x ** 2 + char.position.z ** 2);
                if (distFromCenter > 20) {
                    char.position.x = (char.position.x / distFromCenter) * 20;
                    char.position.z = (char.position.z / distFromCenter) * 20;
                }

                // Blickrichtung
                const angle = Math.atan2(dir.x, dir.z);
                char.mesh.rotation.y = angle;

                // Hüpf-Animation
                char.mesh.position.y = 0.5 + Math.abs(Math.sin(Date.now() * 0.012)) * 0.3;
            } else {
                char.mesh.position.y = 0.5;
            }
        }

        function checkCollisions(char, playerType) {
            stars.forEach(star => {
                if (!star.userData.collected) {
                    const dist = char.position.distanceTo(star.position);
                    if (dist < 1.75) {
                        star.userData.collected = true;
                        star.visible = false;
                        playChime(playerType === 'emma');
                        createConfetti(star.position.x, star.position.y, star.position.z);

                        if (playerType === 'maxi') {
                            scoreMaxi++;
                        } else if (playerType === 'leo') {
                            scoreLeo++;
                        } else if (playerType === 'emma') {
                            scoreEmma++;
                        }

                        const teamScore = scoreMaxi + scoreLeo;
                        const total = teamScore + scoreEmma;

                        document.getElementById('score-team').innerText = teamScore;
                        document.getElementById('score-emma').innerText = scoreEmma;
                        document.getElementById('score-total').innerText = total;

                        if (total >= totalStarsCount) {
                            setTimeout(() => {
                                playWinSound();
                                
                                document.getElementById('win-score-team').innerText = teamScore;
                                document.getElementById('win-score-emma').innerText = scoreEmma;
                                document.getElementById('win-detail-maxi').innerText = scoreMaxi;
                                document.getElementById('win-detail-leo').innerText = scoreLeo;

                                const titleEl = document.getElementById('win-title');
                                const msgEl = document.getElementById('win-message');

                                if (teamScore > scoreEmma) {
                                    titleEl.innerText = '🏆 Maxi & Leo gewinnen! 🎉';
                                    msgEl.innerText = `Teamwork siegt! Zusammen haben Maxi und Leo ${teamScore} Sterne geholt! 💙💚`;
                                } else if (scoreEmma > teamScore) {
                                    titleEl.innerText = '👑 Emma gewinnt! 🏆';
                                    msgEl.innerText = `Super gemacht, Emma! Mit ${scoreEmma} Sternen hast du beide Jungs besiegt! 💖`;
                                } else {
                                    titleEl.innerText = '🤝 Unentschieden! 🏆';
                                    msgEl.innerText = `Wahnsinn! Beide Teams haben genau gleich viele Sterne! 🎉`;
                                }

                                document.getElementById('win-modal').classList.remove('hidden');
                            }, 300);
                        }
                    }
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            updateCharacter(maxi, keysMaxi);
            updateCharacter(leo, keysLeo);
            updateCharacter(emma, keysEmma);

            checkCollisions(maxi, 'maxi');
            checkCollisions(leo, 'leo');
            checkCollisions(emma, 'emma');

            const time = Date.now() * 0.003;
            stars.forEach(star => {
                if (!star.userData.collected) {
                    star.rotation.y += 0.025;
                    star.position.y = star.userData.initialY + Math.sin(time + star.position.x) * 0.3;
                }
            });

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.userData.velocity);
                p.rotation.x += p.userData.rotationSpeed.x;
                p.rotation.y += p.userData.rotationSpeed.y;
                p.userData.velocity.y -= 0.01;
                p.userData.life -= 0.02;
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            // Kamera folgt dem Schwerpunkt aller 3 Spieler
            const avgX = (maxi.position.x + leo.position.x + emma.position.x) / 3;
            const avgZ = (maxi.position.z + leo.position.z + emma.position.z) / 3;
            
            camera.position.x += (avgX - camera.position.x) * 0.05;
            camera.position.z += ((avgZ + 25) - camera.position.z) * 0.05;
            camera.lookAt(avgX, 0, avgZ);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function restartGame() {
            document.getElementById('win-modal').classList.add('hidden');
            scoreMaxi = 0;
            scoreLeo = 0;
            scoreEmma = 0;
            document.getElementById('score-team').innerText = '0';
            document.getElementById('score-emma').innerText = '0';
            document.getElementById('score-total').innerText = '0';

            maxi.position.set(-6, 0.5, 2);
            leo.position.set(-2, 0.5, 4);
            emma.position.set(6, 0.5, -2);

            stars.forEach(star => scene.remove(star));
            stars = [];
            spawnStars();
        }

        window.onload = function() {
            init();
        };
    </script>
</body>
</html>
