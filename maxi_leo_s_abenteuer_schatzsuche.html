<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maxi & Leo's Abenteuer-Schatzsuche</title>
    <!-- Tailwind CSS für modernes UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js für flüssige 3D-Grafik -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Kinderfreundliche Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            touch-action: none;
            overflow: hidden;
            background: #87CEEB;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .btn-touch {
            transition: transform 0.1s, background-color 0.1s;
        }
        .btn-touch:active {
            transform: scale(0.85);
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden">

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- UI Overlay für iPad & Touchscreen -->
    <div class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-4 md:p-6">
        
        <!-- Punktetabelle & Titel -->
        <div class="flex justify-between items-center bg-white/85 backdrop-blur-md px-6 py-3 rounded-3xl shadow-xl pointer-events-auto border-4 border-yellow-300">
            <div class="flex items-center space-x-3">
                <div class="w-6 h-6 rounded-full bg-blue-500 animate-pulse"></div>
                <span class="text-xl md:text-2xl font-bold text-blue-600">Maxi: <span id="score-maxi">0</span> 🌟</span>
            </div>
            
            <div class="text-center">
                <h1 class="text-base md:text-2xl font-black text-amber-500 drop-shadow">Maxi & Leo's Schatzsuche 🌳</h1>
                <p class="text-xs md:text-sm font-semibold text-gray-600">Sterne gesammelt: <span id="score-total">0</span> / 12</p>
            </div>

            <div class="flex items-center space-x-3">
                <span class="text-xl md:text-2xl font-bold text-green-600"><span id="score-leo">0</span> 🌟 :Leo</span>
                <div class="w-6 h-6 rounded-full bg-green-500 animate-pulse"></div>
            </div>
        </div>

        <!-- Gewinn-Modal (erscheint, wenn alle Sterne da sind) -->
        <div id="win-modal" class="absolute inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center pointer-events-auto z-50">
            <div class="bg-yellow-100 border-8 border-yellow-400 rounded-3xl p-8 max-w-md text-center shadow-2xl animate-bounce">
                <h2 class="text-3xl md:text-4xl font-black text-amber-600 mb-4">🎉 Hurra! Super gemacht! 🎉</h2>
                <p class="text-lg md:text-xl font-bold text-gray-700 mb-6">Maxi und Leo haben alle Schätze zusammen gefunden! Ihr seid tolle Abenteurer!</p>
                <button onclick="restartGame()" class="bg-gradient-to-r from-green-400 to-emerald-600 text-white font-bold text-xl px-8 py-4 rounded-2xl shadow-lg hover:scale-105 active:scale-95 transition-transform border-b-4 border-emerald-800">
                    Nochmal spielen! 🚀
                </button>
            </div>
        </div>

        <!-- Touch-Steuerung für beide Enkel (Maxi links, Leo rechts) -->
        <div class="flex justify-between items-end w-full pb-2 pointer-events-auto">
            
            <!-- Maxi Steuerkreuz (Blau) -->
            <div class="bg-blue-500/20 backdrop-blur-md p-3 rounded-3xl border-2 border-blue-400 shadow-xl flex flex-col items-center">
                <div class="text-blue-700 font-bold text-sm mb-1">💙 Maxi</div>
                <div class="grid grid-cols-3 gap-2 w-36 h-36">
                    <div></div>
                    <button id="btn-maxi-up" class="btn-touch bg-blue-500 hover:bg-blue-600 text-white text-2xl font-bold rounded-2xl shadow-md flex items-center justify-center pb-1">⬆️</button>
                    <div></div>
                    <button id="btn-maxi-left" class="btn-touch bg-blue-500 hover:bg-blue-600 text-white text-2xl font-bold rounded-2xl shadow-md flex items-center justify-center pb-1">⬅️</button>
                    <button id="btn-maxi-down" class="btn-touch bg-blue-500 hover:bg-blue-600 text-white text-2xl font-bold rounded-2xl shadow-md flex items-center justify-center pb-1">⬇️</button>
                    <button id="btn-maxi-right" class="btn-touch bg-blue-500 hover:bg-blue-600 text-white text-2xl font-bold rounded-2xl shadow-md flex items-center justify-center pb-1">➡️</button>
                </div>
            </div>

            <!-- Zentrum Info -->
            <div class="hidden md:flex flex-col items-center bg-white/70 px-4 py-2 rounded-2xl shadow">
                <span class="text-xs font-bold text-gray-700">Steuert Maxi & Leo gleichzeitig über die Buttons!</span>
            </div>

            <!-- Leo Steuerkreuz (Grün) -->
            <div class="bg-green-500/20 backdrop-blur-md p-3 rounded-3xl border-2 border-green-400 shadow-xl flex flex-col items-center">
                <div class="text-green-700 font-bold text-sm mb-1">💚 Leo</div>
                <div class="grid grid-cols-3 gap-2 w-36 h-36">
                    <div></div>
                    <button id="btn-leo-up" class="btn-touch bg-green-500 hover:bg-green-600 text-white text-2xl font-bold rounded-2xl shadow-md flex items-center justify-center pb-1">⬆️</button>
                    <div></div>
                    <button id="btn-leo-left" class="btn-touch bg-green-500 hover:bg-green-600 text-white text-2xl font-bold rounded-2xl shadow-md flex items-center justify-center pb-1">⬅️</button>
                    <button id="btn-leo-down" class="btn-touch bg-green-500 hover:bg-green-600 text-white text-2xl font-bold rounded-2xl shadow-md flex items-center justify-center pb-1">⬇️</button>
                    <button id="btn-leo-right" class="btn-touch bg-green-500 hover:bg-green-600 text-white text-2xl font-bold rounded-2xl shadow-md flex items-center justify-center pb-1">➡️</button>
                </div>
            </div>

        </div>

    </div>

    <!-- 3D Spiel- und Audiologik -->
    <script>
        // Web Audio API für fröhliche Soundeffekte
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playChime() {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playWinSound() {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }, idx * 120);
            });
        }

        // Three.js Variablen
        let scene, camera, renderer;
        let maxi, leo;
        let stars = [];
        let particles = [];
        let scoreMaxi = 0;
        let scoreLeo = 0;
        const totalStarsCount = 12;

        const keysMaxi = { up: false, down: false, left: false, right: false };
        const keysLeo = { up: false, down: false, left: false, right: false };

        function init() {
            // Szene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

            // Kamera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 22, 22);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Beleuchtung
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 0.85);
            sunLight.position.set(20, 40, 20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            const d = 25;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // Welt erstellen
            createWorld();

            // Spielfiguren erstellen (Maxi in Blau, Leo in Grün)
            maxi = createCharacter(0x3b82f6, "Maxi", new THREE.Vector3(-4, 0.5, 0));
            leo = createCharacter(0x22c55e, "Leo", new THREE.Vector3(4, 0.5, 0));

            // Sterne verteilen
            spawnStars();

            // Event-Listener
            window.addEventListener('resize', onWindowResize);
            setupTouchControls();

            // Animationsloop starten
            animate();
        }

        function createWorld() {
            // Grüne Insel
            const groundGeo = new THREE.CylinderGeometry(22, 24, 2, 32);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.position.y = -1;
            ground.receiveShadow = true;
            scene.add(ground);

            const dirtGeo = new THREE.CylinderGeometry(24, 25, 3, 32);
            const dirtMat = new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 0.9 });
            const dirt = new THREE.Mesh(dirtGeo, dirtMat);
            dirt.position.y = -3;
            dirt.receiveShadow = true;
            scene.add(dirt);

            // Bäume (Koordinaten als Objekte mit sauberen x/z Werten)
            const treePositions = [
                { x: -12, z: -12 }, { x: 14, z: 10 }, { x: -14, z: 12 }, { x: 12, z: -14 },
                { x: -18, z: 0 }, { x: 18, z: 2 }, { x: 0, z: -18 }, { x: 0, z: 18 },
                { x: -8, z: -15 }, { x: 9, z: 15 }
            ];
            treePositions.forEach(pos => createTree(pos.x, pos.z));

            // Wolken
            for (let i = 0; i < 6; i++) {
                createCloud((Math.random() - 0.5) * 40, 15 + Math.random() * 5, (Math.random() - 0.5) * 40);
            }
        }

        function createTree(x, z) {
            const treeGroup = new THREE.Group();
            
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.6, 0.9, 3, 8),
                new THREE.MeshStandardMaterial({ color: 0x854d0e })
            );
            trunk.position.y = 1.5;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.6 });
            const l1 = new THREE.Mesh(new THREE.SphereGeometry(2, 8, 8), leavesMat);
            l1.position.y = 3.5;
            l1.castShadow = true;
            treeGroup.add(l1);

            const l2 = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.6 }));
            l2.position.set(1, 4.5, 0);
            l2.castShadow = true;
            treeGroup.add(l2);

            treeGroup.position.set(x, 0, z);
            scene.add(treeGroup);
        }

        function createCloud(x, y, z) {
            const cloudGroup = new THREE.Group();
            const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, transparent: true, opacity: 0.9 });
            
            for (let i = 0; i < 4; i++) {
                const puff = new THREE.Mesh(new THREE.SphereGeometry(1.5 + Math.random() * 0.8, 8, 8), cloudMat);
                puff.position.set(i * 1.2 - 1.8, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.8);
                cloudGroup.add(puff);
            }
            cloudGroup.position.set(x, y, z);
            scene.add(cloudGroup);
        }

        function createCharacter(colorHex, name, initialPos) {
            const group = new THREE.Group();

            const body = new THREE.Mesh(
                new THREE.SphereGeometry(1, 16, 16),
                new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.2 })
            );
            body.position.y = 1;
            body.castShadow = true;
            group.add(body);

            // Augen
            const eyeGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const pupilMat = new THREE.MeshStandardMaterial({ color: 0x000000 });

            const eyeLeft = new THREE.Mesh(eyeGeo, eyeMat);
            eyeLeft.position.set(-0.35, 1.3, 0.85);
            group.add(eyeLeft);
            const pLeft = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), pupilMat);
            pLeft.position.set(-0.35, 1.3, 0.98);
            group.add(pLeft);

            const eyeRight = new THREE.Mesh(eyeGeo, eyeMat);
            eyeRight.position.set(0.35, 1.3, 0.85);
            group.add(eyeRight);
            const pRight = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), pupilMat);
            pRight.position.set(0.35, 1.3, 0.98);
            group.add(pRight);

            // Kappe
            const hatMat = new THREE.MeshStandardMaterial({ color: colorHex === 0x3b82f6 ? 0x1d4ed8 : 0x15803d });
            const hatBase = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.2, 12), hatMat);
            hatBase.position.set(0, 1.9, 0);
            hatBase.castShadow = true;
            group.add(hatBase);

            const hatTop = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 12), hatMat);
            hatTop.position.set(0, 2.1, 0);
            hatTop.scale.set(1, 0.7, 1);
            group.add(hatTop);

            // 3D Name direkt über der Figur
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = colorHex === 0x3b82f6 ? '#1d4ed8' : '#15803d';
            ctx.font = 'bold 50px Fredoka, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(name, 128, 70);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.set(0, 3.2, 0);
            sprite.scale.set(2, 1, 1);
            group.add(sprite);

            group.position.copy(initialPos);
            scene.add(group);

            return {
                mesh: group,
                position: group.position,
                speed: 0.13
            };
        }

        function spawnStars() {
            const starGeo = new THREE.OctahedronGeometry(0.8, 0);
            const starMat = new THREE.MeshStandardMaterial({ 
                color: 0xfde047, 
                emissive: 0xfacc15, 
                emissiveIntensity: 0.8,
                roughness: 0.2,
                metalness: 0.8
            });

            const positions = [
                { x: -10, z: 10 }, { x: 10, z: -10 }, { x: -12, z: -8 }, { x: 12, z: 8 },
                { x: -5, z: -12 }, { x: 5, z: 12 }, { x: -15, z: 5 }, { x: 15, z: -5 },
                { x: -3, z: 14 }, { x: 3, z: -14 }, { x: -10, z: 0 }, { x: 10, z: 0 }
            ];

            positions.forEach((pos, idx) => {
                const star = new THREE.Mesh(starGeo, starMat);
                star.position.set(pos.x, 1, pos.z);
                star.rotation.x = Math.random() * Math.PI;
                star.rotation.y = Math.random() * Math.PI;
                star.userData = { id: idx, collected: false, initialY: 1 };
                scene.add(star);
                stars.push(star);
            });
        }

        function createConfetti(x, y, z) {
            const colors = [0xf38ba8, 0xf9e2af, 0xa6e3a1, 0x89b4fa, 0xcba6f7, 0xffffff];
            for (let i = 0; i < 25; i++) {
                const pGeo = new THREE.BoxGeometry(0.25, 0.25, 0.05);
                const pMat = new THREE.MeshBasicMaterial({ color: colors[Math.floor(Math.random() * colors.length)] });
                const particle = new THREE.Mesh(pGeo, pMat);
                particle.position.set(x, y, z);
                
                particle.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.3,
                        Math.random() * 0.3 + 0.1,
                        (Math.random() - 0.5) * 0.3
                    ),
                    rotationSpeed: new THREE.Vector3(Math.random()*0.2, Math.random()*0.2, Math.random()*0.2),
                    life: 1.0
                };
                scene.add(particle);
                particles.push(particle);
            }
        }

        function setupTouchControls() {
            const bindButton = (id, keyState, prop) => {
                const el = document.getElementById(id);
                if (!el) return;
                
                const press = (e) => { e.preventDefault(); keyState[prop] = true; };
                const release = (e) => { e.preventDefault(); keyState[prop] = false; };

                el.addEventListener('mousedown', press);
                el.addEventListener('mouseup', release);
                el.addEventListener('mouseleave', release);
                el.addEventListener('touchstart', press, { passive: false });
                el.addEventListener('touchend', release, { passive: false });
            };

            // Maxi
            bindButton('btn-maxi-up', keysMaxi, 'up');
            bindButton('btn-maxi-down', keysMaxi, 'down');
            bindButton('btn-maxi-left', keysMaxi, 'left');
            bindButton('btn-maxi-right', keysMaxi, 'right');

            // Leo
            bindButton('btn-leo-up', keysLeo, 'up');
            bindButton('btn-leo-down', keysLeo, 'down');
            bindButton('btn-leo-left', keysLeo, 'left');
            bindButton('btn-leo-right', keysLeo, 'right');

            // Tastatur-Fallback (für Tests)
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp') keysLeo.up = true;
                if (e.key === 'ArrowDown') keysLeo.down = true;
                if (e.key === 'ArrowLeft') keysLeo.left = true;
                if (e.key === 'ArrowRight') keysLeo.right = true;
                if (e.key === 'w' || e.key === 'W') keysMaxi.up = true;
                if (e.key === 's' || e.key === 'S') keysMaxi.down = true;
                if (e.key === 'a' || e.key === 'A') keysMaxi.left = true;
                if (e.key === 'd' || e.key === 'D') keysMaxi.right = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowUp') keysLeo.up = false;
                if (e.key === 'ArrowDown') keysLeo.down = false;
                if (e.key === 'ArrowLeft') keysLeo.left = false;
                if (e.key === 'ArrowRight') keysLeo.right = false;
                if (e.key === 'w' || e.key === 'W') keysMaxi.up = false;
                if (e.key === 's' || e.key === 'S') keysMaxi.down = false;
                if (e.key === 'a' || e.key === 'A') keysMaxi.left = false;
                if (e.key === 'd' || e.key === 'D') keysMaxi.right = false;
            });
        }

        function updateCharacter(char, keys) {
            let moveX = 0;
            let moveZ = 0;

            if (keys.up) moveZ -= 1;
            if (keys.down) moveZ += 1;
            if (keys.left) moveX -= 1;
            if (keys.right) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                const dir = new THREE.Vector3(moveX, 0, moveZ).normalize();
                char.position.x += dir.x * char.speed;
                char.position.z += dir.z * char.speed;

                // Inselbegrenzung (Radius ~18)
                const distFromCenter = Math.sqrt(char.position.x ** 2 + char.position.z ** 2);
                if (distFromCenter > 18) {
                    char.position.x = (char.position.x / distFromCenter) * 18;
                    char.position.z = (char.position.z / distFromCenter) * 18;
                }

                // Blickrichtung anpassen
                const angle = Math.atan2(dir.x, dir.z);
                char.mesh.rotation.y = angle;

                // Hüpf-Animation beim Laufen
                char.mesh.position.y = 0.5 + Math.abs(Math.sin(Date.now() * 0.01)) * 0.3;
            } else {
                char.mesh.position.y = 0.5;
            }
        }

        function checkCollisions(char, isMaxi) {
            stars.forEach(star => {
                if (!star.userData.collected) {
                    const dist = char.position.distanceTo(star.position);
                    if (dist < 1.6) {
                        star.userData.collected = true;
                        star.visible = false;
                        playChime();
                        createConfetti(star.position.x, star.position.y, star.position.z);

                        if (isMaxi) {
                            scoreMaxi++;
                            document.getElementById('score-maxi').innerText = scoreMaxi;
                        } else {
                            scoreLeo++;
                            document.getElementById('score-leo').innerText = scoreLeo;
                        }

                        const total = scoreMaxi + scoreLeo;
                        document.getElementById('score-total').innerText = total;

                        if (total >= totalStarsCount) {
                            setTimeout(() => {
                                playWinSound();
                                document.getElementById('win-modal').classList.remove('hidden');
                            }, 300);
                        }
                    }
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            updateCharacter(maxi, keysMaxi);
            updateCharacter(leo, keysLeo);

            checkCollisions(maxi, true);
            checkCollisions(leo, false);

            const time = Date.now() * 0.003;
            stars.forEach(star => {
                if (!star.userData.collected) {
                    star.rotation.y += 0.02;
                    star.position.y = star.userData.initialY + Math.sin(time + star.position.x) * 0.3;
                }
            });

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.userData.velocity);
                p.rotation.x += p.userData.rotationSpeed.x;
                p.rotation.y += p.userData.rotationSpeed.y;
                p.userData.velocity.y -= 0.01;
                p.userData.life -= 0.02;
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            // Kamera folgt beiden Spielern optimal in der Mitte
            const targetCamX = (maxi.position.x + leo.position.x) / 2;
            const targetCamZ = (maxi.position.z + leo.position.z) / 2 + 22;
            camera.position.x += (targetCamX - camera.position.x) * 0.05;
            camera.position.z += (targetCamZ - camera.position.z) * 0.05;
            camera.lookAt(targetCamX, 0, (maxi.position.z + leo.position.z) / 2);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function restartGame() {
            document.getElementById('win-modal').classList.add('hidden');
            scoreMaxi = 0;
            scoreLeo = 0;
            document.getElementById('score-maxi').innerText = '0';
            document.getElementById('score-leo').innerText = '0';
            document.getElementById('score-total').innerText = '0';

            maxi.position.set(-4, 0.5, 0);
            leo.position.set(4, 0.5, 0);

            stars.forEach(star => scene.remove(star));
            stars = [];
            spawnStars();
        }

        window.onload = function() {
            init();
        };
    </script>
</body>
</html>
